<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f5f7;
            color: #172b4d;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            flex-direction: column;
        }

        body::before {
            content: none;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 2px 4px rgba(9,30,66,0.25);
            border: 1px solid #dfe1e6;
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dfe1e6;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h2 {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #0747a6;
            font-size: 24px;
            text-shadow: none;
        }
        button {
            padding: 8px 16px;
            background: #0052cc;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
            text-transform: none;
            letter-spacing: normal;
        }
        button:hover {
            background: #0747a6;
            box-shadow: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #ffffff;
            border-radius: 4px;
            border: 1px solid #dfe1e6;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dfe1e6;
            color: #172b4d;
        }
        th {
            background-color: #f4f5f7;
            color: #172b4d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #f4f5f7;
        }
        .form-group {
            margin-bottom: 20px; /* Increased margin */
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0; /* Lighter color */
            font-size: 14px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dfe1e6;
            border-radius: 3px;
            background: #ffffff;
            color: #172b4d;
            font-size: 14px;
            transition: box-shadow 0.2s, border-color 0.2s;
            box-sizing: border-box;
        }
         input:focus, select:focus {
             outline: none;
             background: #ffffff;
             box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
             border-color: #0052cc;
        }
        .footer {
            text-align: center;
            margin-top: 40px; /* Increased margin */
            font-size: 14px;
            color: #6b778c; /* Subtle color */
        }
        .search-bar {
             margin: 20px 0;
             display: flex;
             gap: 10px;
             align-items: center;
         }
         .search-bar input {
             flex: 1;
             padding: 8px 12px;
             border: 1px solid #dfe1e6;
             border-radius: 3px;
             background: #ffffff;
             color: #172b4d;
             font-size: 14px;
             transition: box-shadow 0.2s, border-color 0.2s;
         }
         .search-bar input:focus {
             outline: none;
             background: #ffffff;
             box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
             border-color: #0052cc;
         }
        .status-select {
             min-width: 120px;
             padding: 8px 12px;
             border: 1px solid #dfe1e6;
             border-radius: 3px;
             background: #ffffff;
             color: #172b4d;
             font-size: 14px;
             transition: box-shadow 0.2s, border-color 0.2s;
        }
         .status-select:focus {
             outline: none;
             background: #ffffff;
             box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
             border-color: #0052cc;
         }
         /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-right: 5px;
        }
        .status-open { background: #28a745; color: #fff; }
        .status-in_progress { background: #ffc107; color: #333; }
        .status-closed { background: #dc3545; color: #fff; }
         /* Comment Modal Styles (Adjusting for dark theme) */
        #commentModal {
             background: rgba(0,0,0,0.5);
        }
        #commentModal > div {
             background: #ffffff;
             border-radius: 4px;
             box-shadow: 0 2px 10px rgba(9,30,66,0.3);
             padding: 24px;
        }
        #commentModal h3 {
             font-family: Arial, sans-serif;
             color: #0747a6;
             margin-bottom: 20px;
             font-size: 18px;
        }
        #modalCommentsList {
             max-height: 300px;
             overflow-y: auto;
             margin-bottom: 20px; /* Increased margin */
             padding-right: 10px; /* Add some padding for scrollbar */
         }

         /* Scrollbar styles for modal comments */
         #modalCommentsList::-webkit-scrollbar {
             width: 8px;
         }
         #modalCommentsList::-webkit-scrollbar-track {
             background: rgba(255, 255, 255, 0.05);
             border-radius: 10px;
         }
         #modalCommentsList::-webkit-scrollbar-thumb {
             background: rgba(255, 255, 255, 0.15);
             border-radius: 10px;
         }
         #modalCommentsList::-webkit-scrollbar-thumb:hover {
             background: rgba(255, 255, 255, 0.25);
         }

        #modalCommentForm {
             margin-top: 10px;
         }
        #modalCommentInput {
             width: 100%;
             min-height: 80px;
             border-radius: 3px;
             padding: 8px 12px;
             border: 1px solid #dfe1e6;
             background: #ffffff;
             color: #172b4d;
             font-size: 14px;
             resize: vertical;
             box-sizing: border-box;
         }
         #modalCommentInput:focus {
             outline: none;
             background: #ffffff;
             box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
             border-color: #0052cc;
         }
         #modalCommentForm > div {
             display: flex;
             gap: 8px;
             align-items: center;
             margin-top: 12px; /* Increased margin */
         }
        #modalCommentStatus {
             flex: 1;
             border-radius: 3px;
             padding: 8px 12px;
             border: 1px solid #dfe1e6;
             background: #ffffff;
             color: #172b4d;
             font-size: 14px;
             appearance: none;
         }
          #modalCommentStatus:focus {
             outline: none;
             background: #ffffff;
             box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
             border-color: #0052cc;
         }
         #modalCommentForm button[type="submit"] {
             padding: 8px 16px;
             border-radius: 3px;
             background: #0052cc;
             color: #fff;
             border: none;
             font-weight: bold;
             font-size: 14px;
             transition: background 0.2s;
             text-transform: none;
         }
          #modalCommentForm button[type="submit"]:hover {
             background: #0747a6;
             box-shadow: none;
         }
         #closeModalBtn {
             color: #aaa;
             transition: color 0.2s;
         }
          #closeModalBtn:hover {
              color: #fff;
          }

        /* Comments styling within modal (similar to admin) */
         .comment-bubble {
             background: #f4f5f7;
             border-radius: 3px;
             padding: 12px;
             margin-bottom: 8px;
             box-shadow: 0 1px 2px rgba(9,30,66,0.15);
             border: 1px solid #dfe1e6;
         }
         .comment-author {
             color: #172b4d;
             font-weight: 600;
             font-size: 13px;
         }
         .comment-time {
             color: #6b778c;
             font-size: 12px;
             margin-left: 8px;
         }
         .comment-content {
             margin-top: 4px;
             color: #172b4d;
             font-size: 13px;
             line-height: 1.4;
         }
         /* Status badges within comments */
         .comment-bubble .status-badge {
             display: inline-block;
             padding: 2px 8px;
             border-radius: 8px;
             font-size: 10px;
             font-weight: 600;
             text-transform: uppercase;
             margin-left: 8px;
             margin-right: 0;
         }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Support Dashboard</h2>
            <button id="logoutButton">Logout</button>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search tickets by title or description...">
            <button onclick="fetchTickets()">Search</button>
        </div>
        <h3>Tickets List</h3>
        <table>
            <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th>Created By</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="ticketsTable">
            <!-- Tickets will be loaded here -->
            </tbody>
        </table>
        <div class="footer">
            <p>&copy; 2024 Support Ticket System. All rights reserved.</p>
        </div>
    </div>
    <div id="commentModal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; z-index:1000; align-items:center; justify-content:center;">
        <div style="max-width:500px; width:90vw; margin:60px auto; position:relative;">
            <button id="closeModalBtn" style="position:absolute; right:12px; top:8px; background:none; border:none; font-size:28px; cursor:pointer; color:#aaa;">&times;</button>
            <h3>Comments</h3>
            <div id="modalCommentsList" style="max-height:300px; overflow-y:auto; margin-bottom:12px;"></div>
            <form id="modalCommentForm" style="margin-top:10px;">
                <textarea id="modalCommentInput" placeholder="Add a comment..." required rows="2" style="width:100%;"></textarea>
                <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                    <select id="modalCommentStatus" style="flex:1;">
                        <option value="open">Open</option>
                        <option value="in_progress">In Progress</option>
                        <option value="closed">Closed</option>
                    </select>
                    <button type="submit" style="padding:8px 18px;">Comment</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        let ticketsCache = [];
        document.addEventListener('DOMContentLoaded', function () {
            fetchTickets();
            document.getElementById('logoutButton').addEventListener('click', function () {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            });
            document.getElementById('searchInput').addEventListener('input', function () {
                renderTickets();
            });
        });

        async function fetchTickets() {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/tickets', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const data = await response.json();
            if (data.success && Array.isArray(data.tickets)) {
                ticketsCache = data.tickets;
                renderTickets();
            } else {
                document.getElementById('ticketsTable').innerHTML = '<tr><td colspan="6">Failed to fetch tickets.</td></tr>';
            }
        }

        function renderTickets() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            let filtered = ticketsCache;
            if (search) {
                filtered = ticketsCache.filter(ticket =>
                    ticket.title.toLowerCase().includes(search) ||
                    ticket.description.toLowerCase().includes(search)
                );
            }
            document.getElementById('ticketsTable').innerHTML = filtered.length ? filtered.map(ticket => `
                <tr>
                    <td><div class="ticket-title">${ticket.title}</div><div class="ticket-description">${ticket.description}</div></td>
                    <td>
                        <span class="status-badge status-${ticket.status}">${ticket.status.replace('_', ' ')}</span>
                    </td>
                    <td>${ticket.assignedTo ? ticket.assignedTo.name : 'Unassigned'}</td>
                    <td>${ticket.createdBy ? ticket.createdBy.name : ''}</td>
                    <td>
                        <button onclick="viewComments('${ticket._id}')">Comments</button>
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="6">No tickets found.</td></tr>';
        }

        window.changeStatus = async function(ticketId, status) {
            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`/api/tickets/${ticketId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });
                const data = await response.json();
                if (!data.success) {
                    alert('Failed to update status: ' + (data.message || 'Unknown error'));
                } else {
                    fetchTickets();
                }
            } catch (err) {
                alert('Error updating status.');
            }
        }

        window.viewComments = async function(ticketId) {
            // 显示模态框
            document.getElementById('commentModal').style.display = 'flex';
            document.getElementById('modalCommentInput').value = '';
            // 记录当前 ticketId
            window._currentTicketId = ticketId;
            await loadComments(ticketId);
        }
        document.getElementById('closeModalBtn').onclick = function() {
            document.getElementById('commentModal').style.display = 'none';
        };
        async function loadComments(ticketId) {
            const token = localStorage.getItem('token');
            const res = await fetch(`/api/tickets/${ticketId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const comments = (data.data && data.data.comments) || [];
            const ticketStatus = data.data && data.data.status;
            const usersMap = {};
            // 预加载所有用户用于显示名字
            const usersRes = await fetch('/api/users', { headers: { 'Authorization': `Bearer ${token}` } });
            const usersData = await usersRes.json();
            if (usersData.success) {
                usersData.data.forEach(u => { usersMap[u._id] = u.name; });
            }
            document.getElementById('modalCommentsList').innerHTML = comments.length ? comments.map(c => `
                <div class='comment-bubble'>
                    <div>
                        <span class='comment-author'>${usersMap[c.author] || c.author || 'User'}</span>
                        <span class='comment-time'>${new Date(c.createdAt).toLocaleString()}</span>
                    </div>
                    <div class='comment-content'>${c.content}</div>
                    ${c.status ? `<span class='status-badge status-${c.status}'>${(c.status).replace('_',' ')}</span>` : ''}
                </div>
            `).join('') : '<div style="color:#6b778c;">No comments yet.</div>';

             // Set status select in modal to the ticket status if no comment status exists
             document.getElementById('modalCommentStatus').value = ticketStatus || 'open';
        }
        document.getElementById('modalCommentForm').onsubmit = async function(e) {
            e.preventDefault();
            const ticketId = window._currentTicketId;
            const token = localStorage.getItem('token');
            const content = document.getElementById('modalCommentInput').value;
            const status = document.getElementById('modalCommentStatus').value;
            if (!content) return false;
            try {
                const response = await fetch(`/api/tickets/${ticketId}/comments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content, status })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('modalCommentInput').value = '';
                    await loadComments(ticketId);
                    fetchTickets();
                } else {
                    alert('Failed to add comment: ' + (data.message || 'Unknown error'));
                }
            } catch (err) {
                alert('Error adding comment.');
            }
            return false;
        }
    </script>
</body>
</html>
